name: ci

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned in .bun-version to the Bun the suite passes on. package.json has no packageManager or engines field.
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
        if: matrix.shard == 1
      # ubuntu-latest ships GNU tar. src/artifact.ts and the archive tests invoke bsdtar.
      # setup-bun installs under the runner home. A plist for another user refuses that
      # path, so the test step uses a stable link outside the home.
      - run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools
          sudo ln -sfn "$(command -v bun)" /usr/local/bin/bun
          echo /usr/local/bin >> "$GITHUB_PATH"
      # One third of the test files per job: the single job was 24 to 25 minutes of a 30 minute limit.
      - run: bun test --shard=${{ matrix.shard }}/3

  # The one status the pull request waits on, under the name it always had.
  check:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.test.result }}" = "success"
